# This is the only organization form that requests automated implementation.
# The codex-fix-requested label is the machine-readable opt-in used by callers.
name: Automated Codex implementation
description: Request a verified Codex change and a normal pull request
title: "[Task]: "
labels: ["technical task", "codex-fix-requested"]
body:
  - type: markdown
    attributes:
      value: |
        This form can start issue-to-PR automation in the repository where the
        issue is created. Do not include secrets, credentials, tokens, personal
        data, or production values. Generated changes always require human review.
  - type: input
    id: target_branch
    attributes:
      label: Target branch
      description: The existing branch that the pull request should target.
      placeholder: main
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Problem and context
      description: Describe what is wrong or what must change, and why.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected repository behavior after the change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
      placeholder: |
        - The requested behavior is implemented.
        - Existing behavior remains compatible.
        - Repository validation passes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Specify required checks and review expectations.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Note security, compatibility, data, infrastructure, or downtime concerns.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, tokens, and sensitive data.
          required: true
