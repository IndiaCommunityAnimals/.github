# Shared maintenance form. The required target branch starts one implementation
# PR in the repository where the issue is created.
name: Technical task
description: Request maintenance, refactoring, testing, CI, or documentation work in a pull request
title: "[Task]: "
labels: ["technical task", "codex-fix-requested"]
body:
  - type: markdown
    attributes:
      value: |
        This form starts issue-to-PR automation in the repository where the
        issue is created. Keep the task limited to one repository and do not
        include secrets, tokens, personal data, or production credentials.
  # Every automation run must resolve one existing base branch before checkout.
  - type: input
    id: target_branch
    attributes:
      label: Target branch
      description: Existing branch that the generated pull request should target.
      placeholder: main
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work is needed and describe the current state.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Required change
      description: Describe exactly what must change without prescribing unrelated cleanup.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable outcomes required for this task to be complete.
      placeholder: |
        - The requested change is implemented.
        - Existing behavior remains compatible.
        - Relevant repository checks pass.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Specify commands or proof required before completion.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Constraints and out of scope
      description: State what must not change and anything intentionally excluded from this task.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Identify blocked work, related issues, external systems, or required sequencing.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, tokens, and sensitive personal data from this issue.
          required: true
