# Shared organization feature form. The required target branch starts one
# implementation PR; external contributors may require approval.
name: Feature request
description: Request a user or platform capability for Codex to implement in a pull request
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This form starts issue-to-PR automation in the repository where the
        issue is created. Split cross-repository work into one linked issue per
        repository, and never include secrets or production credentials.
  # Every automation run must resolve one existing base branch before checkout.
  - type: input
    id: target_branch
    attributes:
      label: Target branch
      description: Existing repository branch that the generated pull request should target.
      placeholder: main
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: Explain the need, who is affected, and why the feature is valuable.
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired behavior
      description: Describe what users or systems should be able to do after implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable and testable outcomes.
      placeholder: |
        - The requested capability is available.
        - Existing behavior remains compatible.
        - Relevant repository checks pass.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What should not be included in this change?
  - type: textarea
    id: evidence
    attributes:
      label: Validation and evidence
      description: Specify the checks and evidence the generated pull request must provide.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Note security, compatibility, data, migration, rollout, or implementation constraints.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, tokens, and sensitive personal data from this issue.
          required: true
