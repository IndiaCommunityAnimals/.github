# Shared organization bug form. The required target branch starts the
# repository's issue-to-PR caller; labels are added automatically if absent.
name: Bug report
description: Report a reproducible defect for Codex to fix in a pull request
title: "[Bug]: "
labels: ["bug", "needs reproduction", "codex-fix-requested"]
body:
  - type: markdown
    attributes:
      value: |
        This form starts issue-to-PR automation in the repository where the
        issue is created. Provide enough detail to reproduce the problem. Do
        not include secrets, tokens, personal data, or production credentials.
  # Every automation run must resolve one existing base branch before checkout.
  - type: input
    id: target_branch
    attributes:
      label: Target branch
      description: Repository default branch that the generated pull request should target.
      placeholder: main
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly explain what is broken and why it matters.
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe what happens now, including the relevant error or incorrect result.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen after the fix.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide deterministic steps, inputs, URLs, or API calls.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add sanitized logs, screenshots, failing tests, or request/response examples when available.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that prove the bug is fixed.
      placeholder: |
        - The reported behavior no longer occurs.
        - Existing behavior remains compatible.
        - Relevant repository checks pass.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Specify the checks and evidence the generated pull request must provide.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Constraints and out of scope
      description: State what must not change and anything intentionally excluded from this fix.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, tokens, and sensitive personal data from this issue.
          required: true
